[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mai-research"
version = "0.2.0"
description = "MAI camera-origin versus generated-image research workbench"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.optional-dependencies]
hub = ["huggingface-hub>=0.34,<2"]
analysis = ["datasets[vision]>=4,<5", "pyarrow>=18"]
generation = [
    "accelerate>=0.31,<2",
    "diffusers>=0.30,<1",
    "huggingface-hub>=0.34,<2",
    "Pillow>=11,<13",
    "safetensors>=0.5,<1",
    "sentencepiece>=0.2,<1",
    "torch>=2.1,<3",
    "transformers>=4.41,<6",
]

[project.scripts]
mai = "mai.__main__:main"
mai-dataset = "mai.dataset_cli:main"

[tool.setuptools.packages.find]
include = ["mai*"]
